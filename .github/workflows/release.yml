name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ${{ runner.os }}-ndk-27.0.12077973
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/isai-release.keystore
          fi

      - name: Build Split APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEYPASS: ${{ secrets.ANDROID_KEYPASS }}
        run: |
          TAG_VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VERSION="${TAG_VERSION//v/}"
          flutter build apk --release --split-per-abi --build-name="$CLEAN_VERSION"
          mkdir -p build/resolved-apks
          cp build/app/outputs/apk/release/isai-*.apk build/resolved-apks/

      - name: Build Universal APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEYPASS: ${{ secrets.ANDROID_KEYPASS }}
        run: |
          TAG_VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VERSION="${TAG_VERSION//v/}"
          flutter build apk --release --build-name="$CLEAN_VERSION"
          cp build/app/outputs/apk/release/isai-*.apk build/resolved-apks/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/resolved-apks/isai-*.apk

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libmpv-dev mpv libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          mkdir -p build/linux-release
          # Create tar.gz bundle
          tar -czf build/linux-release/isai-linux-x64.tar.gz -C build/linux/x64/release/bundle .

          # Create AppImage structure
          APPDIR=build/linux/x64/release/Isai.AppDir
          mkdir -p "$APPDIR"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/"

          # Create AppRun
          cat << 'EOF' | sed 's/^[[:space:]]*//' > "$APPDIR/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/debrid_vault_music" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # Create desktop file
          cat << 'EOF' | sed 's/^[[:space:]]*//' > "$APPDIR/isai.desktop"
          [Desktop Entry]
          Name=Isai
          Exec=debrid_vault_music
          Icon=isai
          Type=Application
          Categories=AudioVideo;Audio;Music;Player;
          Comment=A premium debrid video and music streaming client.
          Terminal=false
          EOF

          # Copy icon
          cp assets/isai_app_icon.png "$APPDIR/isai.png"

          # Download and run appimagetool
          curl -Lo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$APPDIR" build/linux-release/Isai-x86_64.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: build/linux-release/*

  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNING

      - name: Package Windows Bundle
        run: |
          mkdir build\windows-release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows-release\isai-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows-release/isai-windows-x64.zip

  release:
    name: Create GitHub Release
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-app
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: release-assets/

      - name: Extract Latest Changelog Entry
        run: |
          awk '/^## / { count++ } count == 1 { print } count > 1 { exit }' CHANGELOG.md > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: release-body.md
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
